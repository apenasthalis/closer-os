name: closeros

services:
  mysql:
    image: mysql:8.0
    container_name: closeros-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: closeros
      MYSQL_USER: closeros
      MYSQL_PASSWORD: closeros_pw
    ports:
      - "3307:3306"
    volumes:
      - closeros_mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pcloseros_pw"]
      interval: 10s
      timeout: 5s
      retries: 20

  php:
    build:
      context: ./backend
      dockerfile: .docker/php/Dockerfile
    container_name: closeros-php
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: closeros
      DB_USERNAME: closeros
      DB_PASSWORD: closeros_pw
    volumes:
      - ./backend:/var/www/html
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]

volumes:
  closeros_mysqldata:
    name: closeros_mysql_data
